[package]
name = "inlet-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fail-closed inbound boundary checks for local agent gateways"
license = "MIT"
repository = "https://github.com/nicholas-ruest/inlet-guard"
keywords = ["agent", "gateway", "security", "approval", "cli"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
